<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DS 手表聊</title>
<style>
/* 极简样式，兼容旧 WebView */
* { margin:0; padding:0; box-sizing:border-box; -webkit-box-sizing:border-box; }
body { font-family:system-ui,-apple-system,sans-serif; background:#0f1115; color:#e8eaed; height:100vh; display:-webkit-flex; display:flex; -webkit-flex-direction:column; flex-direction:column; }
#bar { padding:8px 10px; background:#1a1d24; border-bottom:1px solid #2a2e37; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:space-between; justify-content:space-between; }
#bar b { font-size:14px; }
#cfgBtn { font-size:12px; color:#8ab4f8; background:none; border:1px solid #3a4a66; border-radius:10px; padding:3px 8px; }
#msgs { -webkit-flex:1; flex:1; overflow-y:auto; padding:10px; }
.msg { margin:6px 0; padding:8px 10px; border-radius:12px; font-size:14px; line-height:1.5; word-break:break-word; }
.user { background:#1e3a5f; margin-left:30px; }
.ai { background:#23262e; margin-right:30px; white-space:pre-wrap; }
.err { background:#3a1a1a; color:#ff9b9b; font-size:12px; }
#inputRow { display:-webkit-flex; display:flex; padding:8px; background:#1a1d24; border-top:1px solid #2a2e37; }
#msg { -webkit-flex:1; flex:1; background:#0f1115; color:#e8eaed; border:1px solid #2a2e37; border-radius:16px; padding:8px 12px; font-size:14px; }
#send { margin-left:6px; padding:0 14px; border:none; border-radius:16px; background:#8ab4f8; color:#0f1115; font-size:14px; font-weight:bold; }
/* 设置面板 */
#cfg { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:#1a1d24; padding:14px; overflow-y:auto; }
#cfg h3 { font-size:14px; margin-bottom:10px; color:#8ab4f8; }
#cfg label { display:block; font-size:12px; color:#9aa0a6; margin:8px 0 4px; }
#cfg input { width:100%; background:#0f1115; border:1px solid #2a2e37; color:#e8eaed; border-radius:8px; padding:8px; font-size:13px; }
#cfgBtn2 { display:block; width:100%; margin-top:14px; padding:10px; border:none; border-radius:12px; background:#8ab4f8; color:#0f1115; font-size:14px; font-weight:bold; }
#hint { font-size:11px; color:#5f6368; margin-top:10px; line-height:1.6; }
</style>
</head>
<body>

<div id="bar">
  <b>DS 手表聊</b>
  <button id="cfgBtn">设置</button>
</div>

<div id="msgs"></div>

<div id="inputRow">
  <input id="msg" type="text" placeholder="输入消息…">
  <button id="send">发</button>
</div>

<div id="cfg">
  <h3>设置</h3>
  <label>DeepSeek API Key（api.deepseek.com 获取）</label>
  <input id="key" type="password" placeholder="sk-...">
  <label>模型（默认 deepseek-chat）</label>
  <input id="model" type="text" value="deepseek-chat">
  <label>接口地址（一般不用改）</label>
  <input id="base" type="text" value="https://api.deepseek.com">
  <button id="cfgBtn2">保存</button>
  <div id="hint">Key 仅保存在手表本地（localStorage），不会上传。<br>回复为一次性返回（非流式），慢一点但稳。</div>
</div>

<script>
(function () {
  var KEY = 'ds_key', MODEL = 'ds_model', BASE = 'ds_base';
  var history = [];
  var busy = false;

  function $(id) { return document.getElementById(id); }

  function loadCfg() {
    var k = '', m = 'deepseek-chat', b = 'https://api.deepseek.com';
    try {
      k = localStorage.getItem(KEY) || '';
      m = localStorage.getItem(MODEL) || m;
      b = localStorage.getItem(BASE) || b;
    } catch (e) {}
    return { key: k, model: m, base: b };
  }

  function addMsg(text, cls) {
    var div = document.createElement('div');
    div.className = 'msg ' + (cls || '');
    div.textContent = text;
    $('msgs').appendChild(div);
    $('msgs').scrollTop = $('msgs').scrollHeight;
    return div;
  }

  function send() {
    if (busy) return;
    var input = $('msg');
    var text = input.value.replace(/^\s+|\s+$/g, '');
    if (!text) return;
    var cfg = loadCfg();
    if (!cfg.key) {
      addMsg('请先点右上角"设置"，填入 DeepSeek API Key', 'err');
      return;
    }
    input.value = '';
    addMsg(text, 'user');
    history.push({ role: 'user', content: text });

    var aiDiv = addMsg('…', 'ai');
    busy = true;

    var body = JSON.stringify({
      model: cfg.model,
      messages: history.slice(-10),
      stream: false
    });

    var xhr = new XMLHttpRequest();
    xhr.open('POST', cfg.base + '/chat/completions', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Authorization', 'Bearer ' + cfg.key);
    xhr.timeout = 120000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      busy = false;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var j = JSON.parse(xhr.responseText);
          var reply = j.choices[0].message.content;
          aiDiv.textContent = reply;
          history.push({ role: 'assistant', content: reply });
        } catch (e) {
          aiDiv.textContent = '解析失败: ' + xhr.responseText.slice(0, 200);
          aiDiv.className += ' err';
        }
      } else {
        aiDiv.textContent = '错误 ' + xhr.status + ': ' + xhr.responseText.slice(0, 300);
        aiDiv.className += ' err';
        history.pop();
      }
    };
    xhr.onerror = function () { busy = false; aiDiv.textContent = '网络错误：请检查手表网络'; aiDiv.className += ' err'; history.pop(); };
    xhr.ontimeout = function () { busy = false; aiDiv.textContent = '超时（120秒）'; aiDiv.className += ' err'; history.pop(); };
    xhr.send(body);
  }

  $('send').onclick = send;
  $('msg').onkeydown = function (e) { if (e.keyCode === 13) send(); };

  $('cfgBtn').onclick = function () {
    var cfg = loadCfg();
    $('key').value = cfg.key;
    $('model').value = cfg.model;
    $('base').value = cfg.base;
    $('cfg').style.display = 'block';
  };

  $('cfgBtn2').onclick = function () {
    try {
      localStorage.setItem(KEY, $('key').value.replace(/^\s+|\s+$/g, ''));
      localStorage.setItem(MODEL, $('model').value || 'deepseek-chat');
      localStorage.setItem(BASE, $('base').value || 'https://api.deepseek.com');
    } catch (e) {
      addMsg('保存失败：浏览器不支持本地存储', 'err');
      return;
    }
    $('cfg').style.display = 'none';
    addMsg('已保存设置', 'ai');
  };

  if (!loadCfg().key) {
    addMsg('欢迎！点右上角"设置"，填入你的 DeepSeek API Key（去 api.deepseek.com 申请）。', 'ai');
  }
})();
</script>
</body>
</html>
