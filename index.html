<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DS 手表聊</title>
<style>
/* 极简样式，兼容旧 WebView，适配圆形手表屏 */
* { margin:0; padding:0; box-sizing:border-box; -webkit-box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family:system-ui,-apple-system,sans-serif; background:#0f1115; color:#e8eaed;
  height:100vh; display:-webkit-flex; display:flex; -webkit-flex-direction:column; flex-direction:column;
  /* 圆形屏安全区：四周留边，边角内容收进可视区 */
  padding:14px 16px 10px;
}
#bar { padding:6px 4px 10px; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:space-between; justify-content:space-between; }
#bar b { font-size:16px; }
#cfgBtn { font-size:13px; color:#8ab4f8; background:none; border:1px solid #3a4a66; border-radius:12px; padding:5px 12px; }
#msgs { -webkit-flex:1; flex:1; overflow-y:auto; padding:2px 4px; }
.msg { margin:8px 0; padding:9px 12px; border-radius:14px; font-size:15px; line-height:1.5; word-break:break-word; }
.user { background:#1e3a5f; margin-left:18px; }
.ai { background:#23262e; margin-right:18px; white-space:pre-wrap; }
.err { background:#3a1a1a; color:#ff9b9b; font-size:13px; }
#inputRow { display:-webkit-flex; display:flex; padding:10px 2px 6px; }
#msg {
  -webkit-flex:1; flex:1; background:#0f1115; color:#e8eaed; border:1px solid #2a2e37;
  border-radius:18px; padding:10px 14px; font-size:15px; min-width:0;
}
#send { margin-left:8px; padding:0 18px; border:none; border-radius:18px; background:#8ab4f8; color:#0f1115; font-size:15px; font-weight:bold; }
/* 设置面板（也收进安全区） */
#cfg { display:none; position:fixed; top:14px; left:16px; right:16px; bottom:10px; background:#1a1d24; border-radius:18px; padding:16px; overflow-y:auto; }
#cfg h3 { font-size:16px; margin-bottom:12px; color:#8ab4f8; }
#cfg label { display:block; font-size:13px; color:#9aa0a6; margin:10px 0 4px; }
#cfg input { width:100%; background:#0f1115; border:1px solid #2a2e37; color:#e8eaed; border-radius:10px; padding:10px; font-size:14px; }
#cfgBtn2 { display:block; width:100%; margin-top:16px; padding:12px; border:none; border-radius:14px; background:#8ab4f8; color:#0f1115; font-size:15px; font-weight:bold; }
#hint { font-size:12px; color:#5f6368; margin-top:12px; line-height:1.7; }
</style>
</head>
<body>

<div id="bar">
  <b>DS 手表聊</b>
  <button id="cfgBtn">设置</button>
</div>

<div id="msgs"></div>

<div id="inputRow">
  <input id="msg" type="text" placeholder="输入消息…">
  <button id="send">发</button>
</div>

<div id="cfg">
  <h3>设置</h3>
  <label>DeepSeek API Key（api.deepseek.com 获取）</label>
  <input id="key" type="password" placeholder="sk-...">
  <label>模型（deepseek-chat / deepseek-v4-pro / v4-flash）</label>
  <input id="model" type="text" value="deepseek-chat">
  <label>接口地址（一般不用改）</label>
  <input id="base" type="text" value="https://api.deepseek.com">
  <button id="cfgBtn2">保存</button>
  <div id="hint">Key 和最近 30 条对话仅存在手表本地。<br>对话记忆：刷新/重开页面后自动恢复最近 30 条。</div>
</div>

<script>
(function () {
  var KEY = 'ds_key', MODEL = 'ds_model', BASE = 'ds_base', HIST = 'ds_hist';
  var MAX_HIST = 30;
  var history = [];
  var busy = false;

  function $(id) { return document.getElementById(id); }

  function loadCfg() {
    var k = '', m = 'deepseek-chat', b = 'https://api.deepseek.com';
    try {
      k = localStorage.getItem(KEY) || '';
      m = localStorage.getItem(MODEL) || m;
      b = localStorage.getItem(BASE) || b;
    } catch (e) {}
    return { key: k, model: m, base: b };
  }

  function saveHistory() {
    try {
      // 只存最近 MAX_HIST 条，截断超长消息防止撑爆存储
      var trimmed = history.slice(-MAX_HIST).map(function (msg) {
        var c = msg.content;
        if (typeof c === 'string' && c.length > 2000) c = c.slice(0, 2000) + '…';
        return { role: msg.role, content: c };
      });
      localStorage.setItem(HIST, JSON.stringify(trimmed));
    } catch (e) {}
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HIST);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Object.prototype.toString.call(arr) === '[object Array]') {
          history = arr.filter(function (m) { return m && m.role && m.content; }).slice(-MAX_HIST);
        }
      }
    } catch (e) { history = []; }
    // 恢复显示
    history.forEach(function (m) {
      addMsg(m.content, m.role === 'user' ? 'user' : 'ai');
    });
  }

  function addMsg(text, cls) {
    var div = document.createElement('div');
    div.className = 'msg ' + (cls || '');
    div.textContent = text;
    $('msgs').appendChild(div);
    $('msgs').scrollTop = $('msgs').scrollHeight;
    return div;
  }

  function send() {
    if (busy) return;
    var input = $('msg');
    var text = input.value.replace(/^\s+|\s+$/g, '');
    if (!text) return;
    var cfg = loadCfg();
    if (!cfg.key) {
      addMsg('请先点"设置"，填入 DeepSeek API Key', 'err');
      return;
    }
    input.value = '';
    addMsg(text, 'user');
    history.push({ role: 'user', content: text });
    saveHistory();

    var aiDiv = addMsg('…', 'ai');
    busy = true;

    var body = JSON.stringify({
      model: cfg.model,
      messages: history.slice(-15),  // 发给模型的上下文，最近 15 条足够
      stream: false
    });

    var xhr = new XMLHttpRequest();
    xhr.open('POST', cfg.base + '/chat/completions', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Authorization', 'Bearer ' + cfg.key);
    xhr.timeout = 120000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      busy = false;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var j = JSON.parse(xhr.responseText);
          var reply = j.choices[0].message.content;
          aiDiv.textContent = reply;
          history.push({ role: 'assistant', content: reply });
          saveHistory();
        } catch (e) {
          aiDiv.textContent = '解析失败: ' + xhr.responseText.slice(0, 200);
          aiDiv.className += ' err';
        }
      } else {
        aiDiv.textContent = '错误 ' + xhr.status + ': ' + xhr.responseText.slice(0, 300);
        aiDiv.className += ' err';
        history.pop();
        saveHistory();
      }
    };
    xhr.onerror = function () { busy = false; aiDiv.textContent = '网络错误：请检查手表网络'; aiDiv.className += ' err'; history.pop(); saveHistory(); };
    xhr.ontimeout = function () { busy = false; aiDiv.textContent = '超时（120秒）'; aiDiv.className += ' err'; history.pop(); saveHistory(); };
    xhr.send(body);
  }

  $('send').onclick = send;
  $('msg').onkeydown = function (e) { if (e.keyCode === 13) send(); };

  $('cfgBtn').onclick = function () {
    var cfg = loadCfg();
    $('key').value = cfg.key;
    $('model').value = cfg.model;
    $('base').value = cfg.base;
    $('cfg').style.display = 'block';
  };

  $('cfgBtn2').onclick = function () {
    try {
      localStorage.setItem(KEY, $('key').value.replace(/^\s+|\s+$/g, ''));
      localStorage.setItem(MODEL, $('model').value || 'deepseek-chat');
      localStorage.setItem(BASE, $('base').value || 'https://api.deepseek.com');
    } catch (e) {
      addMsg('保存失败：浏览器不支持本地存储', 'err');
      return;
    }
    $('cfg').style.display = 'none';
    addMsg('设置已保存 ✅', 'ai');
  };

  // 启动：恢复历史；没有 Key 才提示
  loadHistory();
  if (!loadCfg().key) {
    addMsg('欢迎！点"设置"填入 DeepSeek API Key（一次填写，之后自动记住）。', 'ai');
  }
})();
</script>
</body>
</html>
